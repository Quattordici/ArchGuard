name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on pull requests only; never cancel main or tag (release) runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows matters for archie.json paths and CRLF line endings in diagnostics locations; macOS for case-sensitive vs insensitive file systems.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      # The analyzer is compiled against Roslyn 4.8 and tested here on the newest Roslyn (Directory.Packages.props, RoslynLatest).
      - run: dotnet test -c Release --no-build

  roslyn-floor:
    name: Tests on Roslyn 4.8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      # Hosts hand the analyzer different operation trees (5.x exposes attributes as operation blocks, 4.8 doesn't; phase 0 finding 2), so the
      # same tests run on the oldest Roslyn the analyzer supports. Runs_on_the_requested_Roslyn_version fails if the switch stops working.
      - run: dotnet test -c Release -p:TestAgainstFloors=true

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      # Defence in depth: only tags that point at a commit reachable from main may produce a release.
      - name: Verify release tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main; refusing to pack a release."; exit 1; }
      - name: Pack (version from tag, or a CI pre-release)
        id: pack
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; else VERSION="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          dotnet pack src/Archie.Analyzers -c Release -o artifacts/packages -p:Version="$VERSION"
          # The package is an analyzer only: anything in lib/ would become a runtime reference of every project that installs it.
          contents=$(unzip -Z1 "artifacts/packages/Archie.$VERSION.nupkg")
          for file in analyzers/dotnet/cs/Archie.Analyzers.dll analyzers/dotnet/cs/Archie.Core.dll build/Archie.targets; do
            grep -qx "$file" <<< "$contents" || { echo "::error::The Archie package has no $file."; exit 1; }
          done
          if grep -q '^lib/' <<< "$contents"; then echo "::error::The Archie package has a lib/ folder."; exit 1; fi
          # A version on nuget.org can be unlisted but never deleted or replaced, so the metadata it is shown with is checked before every push.
          nuspec=$(unzip -p "artifacts/packages/Archie.$VERSION.nupkg" Archie.nuspec)
          for expected in '<id>Archie</id>' '<license type="expression">MIT</license>' '<readme>README.md</readme>' \
            '<projectUrl>https://github.com/Quattordici/Archie</projectUrl>' '<developmentDependency>true</developmentDependency>' \
            '<repository type="git" url="https://github.com/Quattordici/Archie"'; do
            grep -qF "$expected" <<< "$nuspec" || { echo "::error::Archie.nuspec has no $expected."; exit 1; }
          done
          grep -qE '<description>.+</description>' <<< "$nuspec" || { echo "::error::Archie.nuspec has no description."; exit 1; }
          grep -qx README.md <<< "$contents" || { echo "::error::The Archie package has no README.md."; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/packages

  # The packed package in a plain project, built by a real SDK's compiler: the analyzer loads (no CS8032/CS9057/AD0001), runs, and
  # build/Archie.targets finds archie.json. 8.0.1xx is the oldest host the analyzer supports (Roslyn 4.8; 8.0.4xx already ships 4.11).
  host:
    name: Host (${{ matrix.name }})
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: .NET 8.0.1xx SDK, Roslyn 4.8
            sdk: 8.0.1xx
            band: '8\.0\.1'
          - name: .NET 10 SDK, current Roslyn
            sdk: 10.0.x
            band: '10\.0\.'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts/packages
      - name: Pin the SDK under test
        env:
          BAND: ${{ matrix.band }}
        run: |
          set -euo pipefail
          sdk=$(dotnet --list-sdks | cut -d' ' -f1 | grep -E "^$BAND" | sort -V | tail -1)
          [[ -n "$sdk" ]] || { echo "::error::No SDK matching $BAND is installed."; exit 1; }
          echo "{\"sdk\":{\"version\":\"$sdk\",\"rollForward\":\"disable\"}}" > tests/HostSmoke/global.json
      - run: tests/HostSmoke/run.sh "${{ needs.pack.outputs.version }}" artifacts/packages

  # SonarQube Cloud (free for public repositories): bugs, code smells and security hotspots, with pull request decoration. Import the
  # repository at sonarcloud.io, turn its Automatic Analysis off (CI analysis replaces it) and add the secret SONAR_TOKEN; the organization and
  # project keys default to the ones the import creates and can be changed with the repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The token is only given to the scanner's begin and end steps, never to the build.
      - name: Check for a token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::SONAR_TOKEN is not set, so the SonarQube Cloud analysis was skipped."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0 # blame information, so new issues are attributed to the change that made them
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: steps.token.outputs.present == 'true'
        with:
          dotnet-version: 10.0.x
      - name: Install the scanner
        if: steps.token.outputs.present == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.3.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Begin the analysis
        if: steps.token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'quattordici' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Quattordici_Archie' }}
        run: >-
          dotnet sonarscanner begin /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.exclusions="tests/HostSmoke/**"
          /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/*.xml"
      - name: Build
        if: steps.token.outputs.present == 'true'
        run: dotnet build -c Release
      # Coverage for the quality gate: every test project writes a coverage file (named by a GUID) to TestResults/; test assemblies are left out.
      - name: Test with coverage
        if: steps.token.outputs.present == 'true'
        run: dotnet test -c Release --no-build -- --coverage --coverage-output-format xml
      - name: End the analysis
        if: steps.token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Trusted publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing): GitHub issues an OIDC
  # token that nuget.org exchanges for a one-hour API key, so no long-lived key is stored. The nuget.org policy
  # must name owner Quattordici, repository Archie, workflow file ci.yml and environment nuget. The release steps are in CONTRIBUTING.md.
  publish:
    name: Publish to NuGet
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, roslyn-floor, pack, host]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      id-token: write # lets the job request the OIDC token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (OIDC → short-lived API key)
        id: login
        # NuGet/login v1 is an annotated tag: this is the peeled commit SHA, not the tag object SHA.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the email address
      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
